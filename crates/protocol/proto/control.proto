syntax = "proto3";

package coolify.sentinel.control.v1;

service Agent {
  rpc Stream(stream AgentMessage) returns (stream ControlMessage);
}

message AgentMessage {
  oneof message {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    CommandAccepted command_accepted = 3;
    CommandResult command_result = 4;
    RuntimeChanged runtime_changed = 5;
  }
}

message ControlMessage {
  oneof message {
    Welcome welcome = 1;
    Command command = 2;
    EventAck event_ack = 3;
    ShutdownHint shutdown_hint = 4;
  }
}

message Hello {
  string server_id = 1;
  string sentinel_version = 2;
  uint32 protocol_min = 3;
  uint32 protocol_max = 4;
  repeated string capabilities = 5;
  string boot_id = 6;
  uint64 trust_bundle_version = 7;
}

message Heartbeat {
  string connection_id = 1;
  int64 sent_at_unix_ms = 2;
}

message RuntimeChanged {
  string event_id = 1;
  int64 observed_at_unix_ms = 2;
}

message Welcome {
  string connection_id = 1;
  uint32 protocol_version = 2;
  uint32 heartbeat_interval_seconds = 3;
  repeated string accepted_capabilities = 4;
  int64 server_time_unix_ms = 5;
}

message Command {
  string command_id = 1;
  string command_type = 2;
  uint32 payload_version = 3;
  int64 created_at_unix_ms = 4;
  reserved 5 to 9;
  // 23 was CorrosionEndpointReconcileRequest; Sentinel now publishes its own endpoints.
  reserved 23;
  reserved "corrosion_endpoint_reconcile";
  oneof payload {
    SystemPingRequest system_ping = 10;
    SystemInfoRequest system_info = 11;
    ContainerListRequest container_list = 12;
    WorkloadDeployRequest workload_deploy = 13;
    WorkloadLifecycleRequest workload_lifecycle = 14;
    WireguardKeyEnsureRequest wireguard_key_ensure = 15;
    WireguardInspectRequest wireguard_inspect = 16;
    WireguardReconcileRequest wireguard_reconcile = 17;
    FirewallInspectRequest firewall_inspect = 18;
    FirewallReconcileRequest firewall_reconcile = 19;
    CorrosionInspectRequest corrosion_inspect = 21;
    CorrosionReconcileRequest corrosion_reconcile = 22;
    ClusterLeaveRequest cluster_leave = 24;
    LogsReadRequest logs_read = 25;
    TrustBundleUpdateRequest trust_bundle_update = 26;
    IngressReconcileRequest ingress_reconcile = 27;
    ContainerLogsRequest container_logs = 28;
  }
  int64 expires_at_unix_ms = 20;
}

message CommandAccepted {
  string command_id = 1;
  int64 accepted_at_unix_ms = 2;
}

enum CommandStatus {
  COMMAND_STATUS_UNSPECIFIED = 0;
  COMMAND_STATUS_SUCCEEDED = 1;
  COMMAND_STATUS_FAILED = 2;
}

message CommandResult {
  string event_id = 1;
  string command_id = 2;
  CommandStatus status = 3;
  int64 observed_at_unix_ms = 4;
  reserved 5 to 9;
  // 23 was CorrosionEndpointReconcileResult; Sentinel now publishes its own endpoints.
  reserved 23;
  reserved "corrosion_endpoint_reconcile";
  oneof payload {
    SystemPingResult system_ping = 10;
    SystemInfoResult system_info = 11;
    ContainerListResult container_list = 12;
    WorkloadDeployResult workload_deploy = 13;
    WorkloadLifecycleResult workload_lifecycle = 14;
    WireguardKeyEnsureResult wireguard_key_ensure = 15;
    WireguardInspectResult wireguard_inspect = 16;
    WireguardReconcileResult wireguard_reconcile = 17;
    FirewallInspectResult firewall_inspect = 18;
    FirewallReconcileResult firewall_reconcile = 19;
    CorrosionInspectResult corrosion_inspect = 21;
    CorrosionReconcileResult corrosion_reconcile = 22;
    ClusterLeaveResult cluster_leave = 24;
    LogsReadResult logs_read = 25;
    TrustBundleUpdateResult trust_bundle_update = 26;
    IngressReconcileResult ingress_reconcile = 27;
    ContainerLogsResult container_logs = 28;
    CommandError error = 20;
  }
}

message EventAck {
  string event_id = 1;
}

message ShutdownHint {
  string reason = 1;
  uint32 reconnect_after_seconds = 2;
}

message SystemPingRequest {
  string nonce = 1;
}

message SystemPingResult {
  string nonce = 1;
  int64 sentinel_time_unix_ms = 2;
  string sentinel_version = 3;
  string boot_id = 4;
}

message SystemInfoRequest {}

message SystemInfoResult {
  optional string hostname = 1;
  optional string operating_system = 2;
  optional string operating_system_version = 3;
  optional string kernel_version = 4;
  optional string architecture = 5;
  optional uint32 cpu_count = 6;
  optional uint64 memory_bytes = 7;
  optional uint64 disk_total_bytes = 8;
  optional uint64 disk_available_bytes = 9;
  string sentinel_version = 10;
  optional string boot_id = 11;
  optional uint64 uptime_seconds = 12;
  optional string container_runtime = 13;
  optional string container_runtime_version = 14;
  optional double cpu_usage_percent = 15;
  optional uint64 memory_used_bytes = 16;
  optional uint64 memory_available_bytes = 17;
  optional double load_average_one = 18;
  optional double load_average_five = 19;
  optional double load_average_fifteen = 20;
}

message ContainerListRequest {}

message ContainerListResult {
  repeated ContainerObservation containers = 1;
}

message ContainerObservation {
  string runtime_id = 1;
  string name = 2;
  string image = 3;
  string state = 4;
  optional string health_status = 5;
  optional uint32 restart_count = 6;
  repeated ContainerPort ports = 7;
  map<string, string> labels = 8;
  optional int64 created_at_unix_ms = 9;
  optional int64 started_at_unix_ms = 10;
}

message ContainerPort {
  optional string host_ip = 1;
  optional uint32 host_port = 2;
  uint32 container_port = 3;
  string protocol = 4;
}

message WorkloadDeployRequest {
  string name = 1;
  string image = 2;
  repeated string command = 3;
  repeated WorkloadEnvironmentVariable environment = 4;
  repeated ContainerPort ports = 5;
  repeated WorkloadLabel labels = 6;
  string restart_policy = 7;
  string network_name = 8;
  string network_subnet = 9;
  string container_ip = 10;
  string dns_server = 11;
  optional double cpu_limit = 12;
  optional double cpu_reservation = 13;
  optional uint64 memory_limit_bytes = 14;
  optional uint64 memory_reservation_bytes = 15;
  // One of "missing", "newer", or "always". Empty means "missing".
  string pull_policy = 16;
}

message WorkloadEnvironmentVariable {
  string key = 1;
  string value = 2;
}

message WorkloadLabel {
  string key = 1;
  string value = 2;
}

message WorkloadDeployResult {
  string runtime_id = 1;
  string name = 2;
  string image = 3;
}

enum WorkloadLifecycleAction {
  WORKLOAD_LIFECYCLE_ACTION_UNSPECIFIED = 0;
  WORKLOAD_LIFECYCLE_ACTION_START = 1;
  WORKLOAD_LIFECYCLE_ACTION_STOP = 2;
  WORKLOAD_LIFECYCLE_ACTION_RESTART = 3;
  WORKLOAD_LIFECYCLE_ACTION_REMOVE = 4;
}

message WorkloadLifecycleRequest {
  string name = 1;
  WorkloadLifecycleAction action = 2;
}

message WorkloadLifecycleResult {
  string name = 1;
  WorkloadLifecycleAction action = 2;
}

message WireguardKeyEnsureRequest { string interface = 1; }
message WireguardKeyEnsureResult { string public_key = 1; }
message ClusterLeaveRequest {
  string interface = 1;
  string owner_node_ip = 2;
  repeated string workload_cidrs = 3;
}
message ClusterLeaveResult {
  bool wireguard_removed = 1;
  bool firewall_removed = 2;
  bool discovery_removed = 3;
  bool resolver_reverted = 4;
}
message WireguardInspectRequest { string interface = 1; uint64 expected_revision = 2; string expected_hash = 3; }
message WireguardPeer { string public_key = 1; string endpoint = 2; repeated string allowed_ips = 3; uint32 persistent_keepalive_seconds = 4; }
message WireguardPeerState { string public_key = 1; string endpoint = 2; repeated string allowed_ips = 3; int64 latest_handshake_unix_seconds = 4; }
message WireguardInspectResult { string interface = 1; string public_key = 2; uint32 listen_port = 3; repeated WireguardPeerState peers = 4; uint64 applied_revision = 5; string configuration_hash = 6; bool drifted = 7; }
message WireguardReconcileRequest { string interface = 1; string address = 2; uint32 listen_port = 3; uint64 revision = 4; repeated WireguardPeer peers = 5; string flux_probe_host = 6; }
message WireguardReconcileResult { WireguardInspectResult state = 1; bool changed = 2; bool rollback_cancelled = 3; }
message FirewallInspectRequest { uint64 expected_revision = 1; string expected_hash = 2; }
message FirewallInspectResult { uint64 applied_revision = 1; string configuration_hash = 2; bool drifted = 3; string table = 4; bool ingress_enforced = 5; }
message FirewallRule { string source_ip = 1; string destination_ip = 2; string protocol = 3; uint32 port = 4; }
message FirewallIngressRule { string destination_ip = 1; string protocol = 2; uint32 port = 3; }
message FirewallReconcileRequest { uint64 revision = 1; uint32 wireguard_port = 2; string cluster_cidr = 3; repeated FirewallRule rules = 4; string wireguard_interface = 5; string flux_probe_host = 6; repeated string workload_cidrs = 7; repeated FirewallIngressRule ingress_rules = 8; string local_node_ip = 9; }
message FirewallReconcileResult { FirewallInspectResult state = 1; bool changed = 2; bool rollback_cancelled = 3; }
message CorrosionInspectRequest {}
message CorrosionInspectResult { string version = 1; string member_state = 2; uint64 endpoint_count = 3; optional int64 last_convergence_unix_seconds = 4; optional uint64 alive_member_count = 5; }
message CorrosionReconcileRequest { string version = 1; string cluster_id = 2; string bind_address = 3; repeated string peers = 4; string node_dns_name = 5; }
message CorrosionReconcileResult { CorrosionInspectResult state = 1; bool changed = 2; }

enum LogSource {
  LOG_SOURCE_UNSPECIFIED = 0;
  LOG_SOURCE_SENTINEL = 1;
  LOG_SOURCE_CORROSION = 2;
  LOG_SOURCE_DISCOVERY_DNS = 3;
}

message LogsReadRequest {
  LogSource source = 1;
  // Newest events to return, 1 to 500.
  uint32 limit = 2;
}

message LogEvent {
  int64 timestamp_unix_ms = 1;
  // One of "error", "warn", "info", "debug", or "trace".
  string level = 2;
  string component = 3;
  string message = 4;
  map<string, string> fields = 5;
}

message LogsReadResult {
  LogSource source = 1;
  // Oldest first.
  repeated LogEvent events = 2;
  bool truncated = 3;
}

// Reads the newest output of one Coolify-managed container (label
// coolify.managed=true) with `podman logs --timestamps`. Stdout and stderr are
// merged in the order Podman wrote them. Read-only; never journaled.
message ContainerLogsRequest {
  // Container name, 1 to 128 of [A-Za-z0-9.-_], starting with a letter or digit.
  string name = 1;
  // Newest lines to return, 1 to 10000.
  uint32 lines = 2;
  // Only lines at or after this Unix time. Must be positive when set.
  optional int64 since_unix_seconds = 3;
}

message ContainerLogsResult {
  string name = 1;
  // Lines like `docker logs --timestamps`: an RFC 3339 timestamp with
  // nanoseconds, a space, then the line. At most 4 MiB.
  string logs = 2;
  // Older output was dropped to stay within 4 MiB.
  bool truncated = 3;
}

// Installs a Flux CA trust bundle for future Flux connections. Sentinel accepts
// only a strictly newer version, or the identical bundle at the installed version.
message TrustBundleUpdateRequest {
  uint64 version = 1;
  // PEM-encoded CA certificates only. Never contains private keys.
  string bundle_pem = 2;
}

message TrustBundleUpdateResult {
  uint64 installed_version = 1;
  bool changed = 2;
}

// Converges this Node's HTTP ingress (Caddy on :80) and the cluster-wide route
// table in Corrosion. Every Node with ingress receives the same request; the
// route write is idempotent for the same revision and rejects older revisions.
message IngressReconcileRequest {
  bool enabled = 1;
  // Must equal the Caddy version this Sentinel pins, for example "v2.11.7".
  string caddy_version = 2;
  uint64 revision = 3;
  repeated IngressRoute routes = 4;
}

message IngressRoute {
  // Lowercase hostname, for example "app.example.com".
  string host = 1;
  // Discovery DNS label of the workload.
  string workload_id = 2;
  string namespace = 3;
  // Workload container port.
  uint32 port = 4;
}

message IngressReconcileResult {
  bool enabled = 1;
  string caddy_version = 2;
  bool active = 3;
  uint64 revision = 4;
  uint64 route_count = 5;
}

message CommandError {
  string code = 1;
  string message = 2;
}
