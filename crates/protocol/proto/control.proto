syntax = "proto3";

package coolify.sentinel.control.v1;

service Agent {
  rpc Stream(stream AgentMessage) returns (stream ControlMessage);
}

message AgentMessage {
  oneof message {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    CommandAccepted command_accepted = 3;
    CommandResult command_result = 4;
    RuntimeChanged runtime_changed = 5;
  }
}

message ControlMessage {
  oneof message {
    Welcome welcome = 1;
    Command command = 2;
    EventAck event_ack = 3;
    ShutdownHint shutdown_hint = 4;
  }
}

message Hello {
  string server_id = 1;
  string sentinel_version = 2;
  uint32 protocol_min = 3;
  uint32 protocol_max = 4;
  repeated string capabilities = 5;
  string boot_id = 6;
  uint64 trust_bundle_version = 7;
}

message Heartbeat {
  string connection_id = 1;
  int64 sent_at_unix_ms = 2;
}

message RuntimeChanged {
  string event_id = 1;
  int64 observed_at_unix_ms = 2;
}

message Welcome {
  string connection_id = 1;
  uint32 protocol_version = 2;
  uint32 heartbeat_interval_seconds = 3;
  repeated string accepted_capabilities = 4;
  int64 server_time_unix_ms = 5;
}

message Command {
  string command_id = 1;
  string command_type = 2;
  uint32 payload_version = 3;
  int64 created_at_unix_ms = 4;
  reserved 5 to 9;
  // 23 was CorrosionEndpointReconcileRequest; Sentinel now publishes its own endpoints.
  reserved 23;
  reserved "corrosion_endpoint_reconcile";
  oneof payload {
    SystemPingRequest system_ping = 10;
    SystemInfoRequest system_info = 11;
    ContainerListRequest container_list = 12;
    WorkloadDeployRequest workload_deploy = 13;
    WorkloadLifecycleRequest workload_lifecycle = 14;
    WireguardKeyEnsureRequest wireguard_key_ensure = 15;
    WireguardInspectRequest wireguard_inspect = 16;
    WireguardReconcileRequest wireguard_reconcile = 17;
    FirewallInspectRequest firewall_inspect = 18;
    FirewallReconcileRequest firewall_reconcile = 19;
    CorrosionInspectRequest corrosion_inspect = 21;
    CorrosionReconcileRequest corrosion_reconcile = 22;
    ClusterLeaveRequest cluster_leave = 24;
    LogsReadRequest logs_read = 25;
    TrustBundleUpdateRequest trust_bundle_update = 26;
    IngressReconcileRequest ingress_reconcile = 27;
    ContainerLogsRequest container_logs = 28;
    ImageBuildRequest image_build = 29;
    BuilderReconcileRequest builder_reconcile = 30;
    RegistryReconcileRequest registry_reconcile = 31;
    VolumeDeleteRequest volume_delete = 32;
    VolumeServeRequest volume_serve = 33;
    VolumeReceiveRequest volume_receive = 34;
    RegistryInspectRequest registry_inspect = 35;
  }
  int64 expires_at_unix_ms = 20;
}

message CommandAccepted {
  string command_id = 1;
  int64 accepted_at_unix_ms = 2;
}

enum CommandStatus {
  COMMAND_STATUS_UNSPECIFIED = 0;
  COMMAND_STATUS_SUCCEEDED = 1;
  COMMAND_STATUS_FAILED = 2;
}

message CommandResult {
  string event_id = 1;
  string command_id = 2;
  CommandStatus status = 3;
  int64 observed_at_unix_ms = 4;
  reserved 5 to 9;
  // 23 was CorrosionEndpointReconcileResult; Sentinel now publishes its own endpoints.
  reserved 23;
  reserved "corrosion_endpoint_reconcile";
  oneof payload {
    SystemPingResult system_ping = 10;
    SystemInfoResult system_info = 11;
    ContainerListResult container_list = 12;
    WorkloadDeployResult workload_deploy = 13;
    WorkloadLifecycleResult workload_lifecycle = 14;
    WireguardKeyEnsureResult wireguard_key_ensure = 15;
    WireguardInspectResult wireguard_inspect = 16;
    WireguardReconcileResult wireguard_reconcile = 17;
    FirewallInspectResult firewall_inspect = 18;
    FirewallReconcileResult firewall_reconcile = 19;
    CorrosionInspectResult corrosion_inspect = 21;
    CorrosionReconcileResult corrosion_reconcile = 22;
    ClusterLeaveResult cluster_leave = 24;
    LogsReadResult logs_read = 25;
    TrustBundleUpdateResult trust_bundle_update = 26;
    IngressReconcileResult ingress_reconcile = 27;
    ContainerLogsResult container_logs = 28;
    ImageBuildResult image_build = 29;
    BuilderReconcileResult builder_reconcile = 30;
    RegistryReconcileResult registry_reconcile = 31;
    VolumeDeleteResult volume_delete = 32;
    VolumeServeResult volume_serve = 33;
    VolumeReceiveResult volume_receive = 34;
    RegistryInspectResult registry_inspect = 35;
    CommandError error = 20;
  }
}

message EventAck {
  string event_id = 1;
}

message ShutdownHint {
  string reason = 1;
  uint32 reconnect_after_seconds = 2;
}

message SystemPingRequest {
  string nonce = 1;
}

message SystemPingResult {
  string nonce = 1;
  int64 sentinel_time_unix_ms = 2;
  string sentinel_version = 3;
  string boot_id = 4;
}

message SystemInfoRequest {}

message SystemInfoResult {
  optional string hostname = 1;
  optional string operating_system = 2;
  optional string operating_system_version = 3;
  optional string kernel_version = 4;
  optional string architecture = 5;
  optional uint32 cpu_count = 6;
  optional uint64 memory_bytes = 7;
  optional uint64 disk_total_bytes = 8;
  optional uint64 disk_available_bytes = 9;
  string sentinel_version = 10;
  optional string boot_id = 11;
  optional uint64 uptime_seconds = 12;
  optional string container_runtime = 13;
  optional string container_runtime_version = 14;
  optional double cpu_usage_percent = 15;
  optional uint64 memory_used_bytes = 16;
  optional uint64 memory_available_bytes = 17;
  optional double load_average_one = 18;
  optional double load_average_five = 19;
  optional double load_average_fifteen = 20;
  // The certificate state of every host, reported only by the cluster's
  // certificate issuer.
  repeated IngressCertificateStatus ingress_certificates = 21;
}

message IngressCertificateStatus {
  string host = 1;
  // "issued", "failed", "dns_mismatch", "orphaned" or "pending".
  string status = 2;
  // Unix seconds; 0 without a certificate.
  int64 not_after = 3;
  string error = 4;
  // Unix seconds of the next order attempt; 0 when none is scheduled.
  int64 next_attempt_at = 5;
}

message ContainerListRequest {}

message ContainerListResult {
  repeated ContainerObservation containers = 1;
  // Only volumes with the label `coolify.managed=true`.
  repeated VolumeObservation volumes = 2;
}

message VolumeObservation {
  string name = 1;
  map<string, string> labels = 2;
  optional int64 created_at_unix_ms = 3;
}

message ContainerObservation {
  string runtime_id = 1;
  string name = 2;
  string image = 3;
  string state = 4;
  optional string health_status = 5;
  optional uint32 restart_count = 6;
  repeated ContainerPort ports = 7;
  map<string, string> labels = 8;
  optional int64 created_at_unix_ms = 9;
  optional int64 started_at_unix_ms = 10;
}

message ContainerPort {
  optional string host_ip = 1;
  optional uint32 host_port = 2;
  uint32 container_port = 3;
  string protocol = 4;
}

message WorkloadDeployRequest {
  string name = 1;
  string image = 2;
  repeated string command = 3;
  repeated WorkloadEnvironmentVariable environment = 4;
  repeated ContainerPort ports = 5;
  repeated WorkloadLabel labels = 6;
  string restart_policy = 7;
  string network_name = 8;
  string network_subnet = 9;
  string container_ip = 10;
  string dns_server = 11;
  optional double cpu_limit = 12;
  optional double cpu_reservation = 13;
  optional uint64 memory_limit_bytes = 14;
  optional uint64 memory_reservation_bytes = 15;
  // One of "missing", "newer", or "always". Empty means "missing".
  string pull_policy = 16;
  // Named Podman volumes (decision 0007). Sentinel creates a missing volume
  // with the labels `coolify.managed=true` and `coolify.volume=<uuid>` before
  // it creates the container. At most 32.
  repeated WorkloadVolumeMount mounts = 17;
  // A health check that replaces the HEALTHCHECK of the image. Absent means
  // the container keeps the HEALTHCHECK of the image, if it has one.
  optional WorkloadHealthCheck health_check = 18;
  // Values that the container reads as files at `/run/secrets/<key>`
  // (decision 0008). Sentinel stores each one as a Podman secret for this
  // revision; the value is never in the environment of the container. Needs
  // the label `coolify.revision` and `workload.secrets.v1`. At most 128.
  repeated WorkloadSecret secrets = 19;
}

message WorkloadSecret {
  // The file name: 1 to 255 ASCII letters, digits, `_`, `.` or `-`, not `.`
  // or `..`. Unique in a request.
  string key = 1;
  // 1 byte to 512 kB.
  string value = 2;
}

// `podman run --health-*`. The command runs in the container with `/bin/sh -c`.
message WorkloadHealthCheck {
  string command = 1;
  uint32 interval_seconds = 2;
  uint32 timeout_seconds = 3;
  uint32 retries = 4;
  uint32 start_period_seconds = 5;
}

message WorkloadVolumeMount {
  // `coolify-vol-<uuid>`.
  string volume_name = 1;
  // Absolute and normalized, not `/`, without `,`. Unique in a request.
  string container_path = 2;
  bool read_only = 3;
}

message WorkloadEnvironmentVariable {
  string key = 1;
  string value = 2;
}

message WorkloadLabel {
  string key = 1;
  string value = 2;
}

message WorkloadDeployResult {
  string runtime_id = 1;
  string name = 2;
  string image = 3;
}

enum WorkloadLifecycleAction {
  WORKLOAD_LIFECYCLE_ACTION_UNSPECIFIED = 0;
  WORKLOAD_LIFECYCLE_ACTION_START = 1;
  WORKLOAD_LIFECYCLE_ACTION_STOP = 2;
  WORKLOAD_LIFECYCLE_ACTION_RESTART = 3;
  WORKLOAD_LIFECYCLE_ACTION_REMOVE = 4;
}

message WorkloadLifecycleRequest {
  string name = 1;
  WorkloadLifecycleAction action = 2;
  // Seconds that STOP and RESTART wait before they kill the container, 1 to
  // 600. Unset is 10. Needs `workload.stop_timeout.v1`.
  optional uint32 stop_timeout_seconds = 3;
}

message WorkloadLifecycleResult {
  string name = 1;
  WorkloadLifecycleAction action = 2;
}

message WireguardKeyEnsureRequest { string interface = 1; }
message WireguardKeyEnsureResult { string public_key = 1; }
message ClusterLeaveRequest {
  string interface = 1;
  string owner_node_ip = 2;
  repeated string workload_cidrs = 3;
}
message ClusterLeaveResult {
  bool wireguard_removed = 1;
  bool firewall_removed = 2;
  bool discovery_removed = 3;
  bool resolver_reverted = 4;
}
message WireguardInspectRequest { string interface = 1; uint64 expected_revision = 2; string expected_hash = 3; }
message WireguardPeer { string public_key = 1; string endpoint = 2; repeated string allowed_ips = 3; uint32 persistent_keepalive_seconds = 4; }
message WireguardPeerState { string public_key = 1; string endpoint = 2; repeated string allowed_ips = 3; int64 latest_handshake_unix_seconds = 4; }
message WireguardInspectResult { string interface = 1; string public_key = 2; uint32 listen_port = 3; repeated WireguardPeerState peers = 4; uint64 applied_revision = 5; string configuration_hash = 6; bool drifted = 7; }
message WireguardReconcileRequest { string interface = 1; string address = 2; uint32 listen_port = 3; uint64 revision = 4; repeated WireguardPeer peers = 5; string flux_probe_host = 6; }
message WireguardReconcileResult { WireguardInspectResult state = 1; bool changed = 2; bool rollback_cancelled = 3; }
message FirewallInspectRequest { uint64 expected_revision = 1; string expected_hash = 2; }
message FirewallInspectResult { uint64 applied_revision = 1; string configuration_hash = 2; bool drifted = 3; string table = 4; bool ingress_enforced = 5; }
message FirewallRule { string source_ip = 1; string destination_ip = 2; string protocol = 3; uint32 port = 4; }
message FirewallIngressRule { string destination_ip = 1; string protocol = 2; uint32 port = 3; }
message FirewallReconcileRequest { uint64 revision = 1; uint32 wireguard_port = 2; string cluster_cidr = 3; repeated FirewallRule rules = 4; string wireguard_interface = 5; string flux_probe_host = 6; repeated string workload_cidrs = 7; repeated FirewallIngressRule ingress_rules = 8; string local_node_ip = 9;
  // Mesh IP of the Node that runs the cluster registry, or empty. Every Node
  // host may then reach it on tcp 5443; workload addresses may not.
  string registry_ip = 10; }
message FirewallReconcileResult { FirewallInspectResult state = 1; bool changed = 2; bool rollback_cancelled = 3; }
message CorrosionInspectRequest {}
message CorrosionInspectResult { string version = 1; string member_state = 2; uint64 endpoint_count = 3; optional int64 last_convergence_unix_seconds = 4; optional uint64 alive_member_count = 5; }
message CorrosionReconcileRequest { string version = 1; string cluster_id = 2; string bind_address = 3; repeated string peers = 4; string node_dns_name = 5; }
message CorrosionReconcileResult { CorrosionInspectResult state = 1; bool changed = 2; }

enum LogSource {
  LOG_SOURCE_UNSPECIFIED = 0;
  LOG_SOURCE_SENTINEL = 1;
  LOG_SOURCE_CORROSION = 2;
  LOG_SOURCE_DISCOVERY_DNS = 3;
}

message LogsReadRequest {
  LogSource source = 1;
  // Newest events to return, 1 to 500.
  uint32 limit = 2;
}

message LogEvent {
  int64 timestamp_unix_ms = 1;
  // One of "error", "warn", "info", "debug", or "trace".
  string level = 2;
  string component = 3;
  string message = 4;
  map<string, string> fields = 5;
}

message LogsReadResult {
  LogSource source = 1;
  // Oldest first.
  repeated LogEvent events = 2;
  bool truncated = 3;
}

// Reads the newest output of one Coolify-managed container (label
// coolify.managed=true) with `podman logs --timestamps`. Stdout and stderr are
// merged in the order Podman wrote them. Read-only; never journaled.
message ContainerLogsRequest {
  // Container name, 1 to 128 of [A-Za-z0-9.-_], starting with a letter or digit.
  string name = 1;
  // Newest lines to return, 1 to 10000.
  uint32 lines = 2;
  // Only lines at or after this Unix time. Must be positive when set.
  optional int64 since_unix_seconds = 3;
}

message ContainerLogsResult {
  string name = 1;
  // Lines like `docker logs --timestamps`: an RFC 3339 timestamp with
  // nanoseconds, a space, then the line. At most 4 MiB.
  string logs = 2;
  // Older output was dropped to stay within 4 MiB.
  bool truncated = 3;
}

// Installs a Flux CA trust bundle for future Flux connections. Sentinel accepts
// only a strictly newer version, or the identical bundle at the installed version.
message TrustBundleUpdateRequest {
  uint64 version = 1;
  // PEM-encoded CA certificates only. Never contains private keys.
  string bundle_pem = 2;
}

message TrustBundleUpdateResult {
  uint64 installed_version = 1;
  bool changed = 2;
}

// Converges this Node's HTTP ingress (Caddy on :80, and :443 for hosts with a
// certificate) and the cluster-wide route and internal name tables in
// Corrosion. Every cluster Node receives the same routes and names; `enabled`
// only controls Caddy on this Node. The table write is idempotent for the same
// revision and rejects older revisions.
message IngressReconcileRequest {
  bool enabled = 1;
  // Must equal the Caddy version this Sentinel pins, for example "v2.11.7".
  string caddy_version = 2;
  uint64 revision = 3;
  repeated IngressRoute routes = 4;
  repeated WorkloadName names = 5;
  // Serve the certificates in Corrosion over HTTPS. Requires `enabled`.
  bool tls_enabled = 6;
  // The 32-byte cluster key that decrypts the certificate private keys in
  // Corrosion. Set exactly when `tls_enabled` is set.
  bytes tls_key = 7;
  // This Node orders and renews the certificates of the cluster. Coolify sets
  // it on one ingress Node. Requires `tls_enabled`.
  bool tls_issuer = 8;
  // The ACME directory, for example Let's Encrypt. Set exactly when `tls_issuer` is set.
  string acme_directory_url = 9;
  // The public IPv4 or IPv6 address of every ingress Node, the issuer
  // included: what DNS records point to. The issuer orders only hosts that
  // resolve to one of them, and checks on each of them that the challenge is
  // served before the CA validates it. Set exactly when `tls_issuer` is set.
  repeated string ingress_public_ips = 10;
  // PEM of the only root CA the issuer trusts for the ACME directory, for a
  // test CA like Pebble. Empty uses the system roots. Only with `tls_issuer`.
  string acme_ca_pem = 11;
}

// An internal DNS name, `<name>.<namespace>.coolify.internal`, of a workload.
message WorkloadName {
  // DNS label, for example "api".
  string name = 1;
  // Workload ID: the `coolify.workload` container label.
  string workload_id = 2;
  string namespace = 3;
}

message IngressRoute {
  // Lowercase hostname, for example "app.example.com".
  string host = 1;
  // Workload ID: the `coolify.workload` container label.
  string workload_id = 2;
  string namespace = 3;
  // Workload container port.
  uint32 port = 4;
}

message IngressReconcileResult {
  bool enabled = 1;
  string caddy_version = 2;
  bool active = 3;
  uint64 revision = 4;
  uint64 route_count = 5;
  uint64 name_count = 6;
  bool tls_enabled = 7;
}

// Starts a one-shot build container `coolify-build-<build_id>` and returns
// when it runs; it does not wait for the build. The container has the label
// `coolify.build=<build_id>`. Coolify reads its state with `container.list`,
// its output with `container.logs`, stops it with `workload.lifecycle`, and
// removes it with `workload.lifecycle` when it no longer needs the log. The
// last log line of a successful build is
// `COOLIFY_BUILD_RESULT {"digest":"sha256:..."}`.
message ImageBuildRequest {
  // 1 to 64 ASCII letters, digits or `-`.
  string build_id = 1;
  // The coolify-builder image, for example
  // "ghcr.io/coollabsio/coolify-builder:1.0.0@sha256:...".
  string builder_image = 2;
  // A public `https://` Git URL without credentials.
  string repository_url = 3;
  // The full commit SHA (40 or 64 lowercase hex characters).
  string commit_sha = 4;
  // "dockerfile" or "railpack".
  string source_type = 5;
  // Relative to the repository root; empty is the root.
  string base_directory = 6;
  // Relative to `base_directory`; empty is "Dockerfile". Only for "dockerfile".
  string dockerfile_path = 7;
  // The target in the cluster registry:
  // "registry.cluster.coolify.internal:5443/<repository>:<tag>".
  string image = 8;
}

message ImageBuildResult {
  string runtime_id = 1;
  string name = 2;
}

// Converges BuildKit on this Node: the `coolify-buildkitd` container (rootless
// BuildKit with a private uid range) and its cache limit. A disabled builder
// removes the container and its cache. Needs the registry trust from
// `registry.reconcile.v1`.
message BuilderReconcileRequest {
  bool enabled = 1;
  // The BuildKit cache limit. 0 uses 20% of the root disk.
  uint64 max_used_space_bytes = 2;
  // The registry user that may push. Set exactly when `enabled` is set.
  string push_username = 3;
  string push_password = 4;
}

message BuilderReconcileResult {
  bool enabled = 1;
  bool running = 2;
  // A user-namespace AppArmor profile was needed and is loaded.
  bool apparmor_profile = 3;
}

// Converges the cluster registry on this Node. Every Node gets the trust (CA
// and pull credential for Podman). Only the registry Node gets `server`; on
// every other Node Sentinel removes the registry container and keeps its
// data volume, so a role that returns finds its images again.
message RegistryReconcileRequest {
  // PEM of the registry CA. Never a private key.
  string ca_pem = 1;
  string pull_username = 2;
  string pull_password = 3;
  RegistryServer server = 4;
}

message RegistryServer {
  // Server certificate for `registry.cluster.coolify.internal` and its key.
  string certificate_pem = 1;
  string private_key_pem = 2;
  // bcrypt htpasswd lines of the push and pull users.
  string htpasswd = 3;
  // The user with push access. Every other user can only pull.
  string push_username = 4;
  // Tags to keep in each repository, 1 to 100.
  uint32 keep_tags = 5;
}

// A read-only report of the cluster registry and the build cache on this
// Node. Every Node reports its disk use; the registry Node also reports
// whether zot answers, and its repositories and tags.
message RegistryInspectRequest {}

message RegistryInspectResult {
  // zot runs on this Node.
  bool registry_running = 1;
  // zot answered over TLS with the pull credential. Only on the registry Node.
  bool healthy = 2;
  // Why zot did not answer, when it runs but is not healthy.
  string error = 3;
  // At most 100 repositories with at most 50 tags each.
  repeated RegistryRepository repositories = 4;
  bool repositories_truncated = 5;
  // Disk use of the registry volume and the BuildKit cache on this Node.
  uint64 registry_bytes = 6;
  uint64 build_cache_bytes = 7;
  bool builder_running = 8;
}

message RegistryRepository {
  string name = 1;
  repeated RegistryTag tags = 2;
}

message RegistryTag {
  string tag = 1;
  // `sha256:...`, or empty when it was not looked up.
  string digest = 2;
}

message RegistryReconcileResult {
  bool trust_installed = 1;
  bool server_running = 2;
  // "registry.cluster.coolify.internal:5443".
  string registry_host = 3;
}

// Deletes Coolify volumes. Sentinel rejects the request when a container
// uses one of them. A volume that does not exist is reported as missing.
message VolumeDeleteRequest {
  // 1 to 32 `coolify-vol-<uuid>` names.
  repeated string names = 1;
}

message VolumeDeleteResult {
  repeated string deleted = 1;
  repeated string missing = 2;
}

// Serves volumes read-only to one peer Node with a temporary `rsync --daemon`
// on this Node's WireGuard address. Idempotent per `transfer_id`. Never
// journaled: the request holds the transfer secret.
message VolumeServeRequest {
  // 1 to 64 ASCII letters, digits or `-`.
  string transfer_id = 1;
  // 1 to 32 `coolify-vol-<uuid>` names. Not needed with `stop`.
  repeated string names = 2;
  // The WireGuard address of the receiving Node.
  string peer_ip = 3;
  // 32 to 128 ASCII letters or digits.
  string secret = 4;
  // Sentinel stops serving at this time.
  int64 expires_at_unix_ms = 5;
  // Stops serving and removes the firewall rule. Succeeds when nothing runs.
  bool stop = 6;
}

message VolumeServeResult {
  // Empty after `stop`.
  string address = 1;
  uint32 port = 2;
  repeated VolumeUsage volumes = 3;
}

message VolumeUsage {
  string name = 1;
  // The apparent size of the files in the volume.
  uint64 used_bytes = 2;
}

// Copies volumes from a serving Node into local volumes. The first call for a
// `transfer_id` and `pass` creates the missing volumes and starts the copy in
// the background; every call returns the current state. Never journaled: the
// request holds the transfer secret.
message VolumeReceiveRequest {
  string transfer_id = 1;
  // "warm" or "final".
  string pass = 2;
  string source_address = 3;
  uint32 source_port = 4;
  string secret = 5;
  repeated string names = 6;
}

message VolumeReceiveResult {
  // "running", "succeeded" or "failed".
  string state = 1;
  // 0 while unknown.
  uint64 bytes_total = 2;
  uint64 bytes_done = 3;
  // The end of the rsync error output when the pass failed.
  string error = 4;
}

message CommandError {
  string code = 1;
  string message = 2;
}
