name: Sentinel Release

on:
  release:
    types: [prereleased, released]

permissions:
  contents: read
  packages: write

env:
  GITHUB_REGISTRY: ghcr.io
  DOCKER_REGISTRY: docker.io
  IMAGE_NAME: "coollabsio/sentinel"
  # Host binary and Flux broker images are GHCR-only, like the `main` builds.
  HOST_IMAGE_NAME: "coollabsio/sentinel-host"
  FLUX_IMAGE_NAME: "coollabsio/flux"

jobs:
  build-push:
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Get version without v prefix
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Login to ${{ env.GITHUB_REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN  }}

      - name: Login to ${{ env.DOCKER_REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image (${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-${{ matrix.arch }}
            ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-${{ matrix.arch }}
          labels: |
            coolify.managed=true

      - name: Build and Push Host Artifact (${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.host
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            ${{ env.GITHUB_REGISTRY }}/${{ env.HOST_IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-${{ matrix.arch }}
          labels: |
            coolify.managed=true
            org.opencontainers.image.description=Portable Sentinel host binary

      - name: Build and Push Flux Image (${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.flux
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.GITHUB_REGISTRY }}/${{ env.FLUX_IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-${{ matrix.arch }}
          labels: |
            coolify.managed=true
            org.opencontainers.image.description=Coolify Flux connection broker

  merge-manifest:
    runs-on: ubuntu-24.04
    needs: build-push
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Get version without v prefix
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v4

      - name: Login to ${{ env.GITHUB_REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN  }}

      - name: Login to ${{ env.DOCKER_REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create & publish manifest on ${{ env.GITHUB_REGISTRY }}
        run: |
          docker buildx imagetools create \
          ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-amd64 \
          ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-aarch64 \
          --tag ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}

      - name: Update latest manifest on ${{ env.GITHUB_REGISTRY }}
        if: ${{ !github.event.release.prerelease }}
        run: |
          docker buildx imagetools create \
          ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }} \
          --tag ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Create & publish host artifact and Flux manifests
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          {
            echo "### Host images for $VERSION"
            echo
            echo "| Image | Digest |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for image in "$HOST_IMAGE_NAME" "$FLUX_IMAGE_NAME"; do
            reference="$GITHUB_REGISTRY/$image:$VERSION"
            docker buildx imagetools create \
              "$reference-amd64" \
              "$reference-aarch64" \
              --tag "$reference"
            digest="$(docker buildx imagetools inspect "$reference" --format '{{json .Manifest}}' | jq -r .digest)"
            case "$digest" in
              sha256:*) ;;
              *) echo "Could not read the manifest digest of $reference" >&2; exit 1 ;;
            esac
            echo "$reference@$digest"
            echo "| \`$reference\` | \`$digest\` |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Create & publish manifest on ${{ env.DOCKER_REGISTRY }}
        run: |
          docker buildx imagetools create \
          ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-amd64 \
          ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-aarch64 \
          --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}

      - name: Update latest manifest on ${{ env.DOCKER_REGISTRY }}
        if: ${{ !github.event.release.prerelease }}
        run: |
          docker buildx imagetools create \
          ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }} \
          --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_PROD_RELEASE_CHANNEL  }}
