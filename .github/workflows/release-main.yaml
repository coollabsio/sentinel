name: Sentinel Release Main

# Every merge to `main` publishes a multi-arch `main` image to GHCR so it can
# be pulled for development WITHOUT cutting a release. Each run also tags
# `main-<shortsha>` so a dev setup can pin one commit. Deliberately GHCR-only
# and never tagged `latest`: `latest` is reserved for real releases
# (`release.yaml`), and Docker Hub only carries released/`next` images.

on:
  workflow_dispatch:
  push:
    branches: ['main']

permissions:
  contents: read
  packages: write

env:
  GITHUB_REGISTRY: ghcr.io
  IMAGE_NAME: "coollabsio/sentinel"
  HOST_IMAGE_NAME: "coollabsio/sentinel-host"
  FLUX_IMAGE_NAME: "coollabsio/flux"
  BUILDER_IMAGE_NAME: "coollabsio/coolify-builder"

jobs:
  build-push:
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set short commit SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ${{ env.GITHUB_REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image, host, and Flux steps are targets of one Dockerfile and share
      # its builder stage, so only the first step compiles. They stay in one
      # job for this reason. No VERSION build arg: the image and the host
      # artifact share one binary, and a non-numeric version such as "main"
      # makes Coolify's version_compare() restart Sentinel in a loop.
      - name: Build and Push Image (${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          cache-from: type=gha,scope=sentinel-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=sentinel-${{ matrix.arch }}
          tags: |
            ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:main-${{ matrix.arch }}
            ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:main-${{ env.SHORT_SHA }}-${{ matrix.arch }}
          labels: |
            coolify.managed=true

      - name: Build and Push Host Artifact (${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: host
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.GITHUB_REGISTRY }}/${{ env.HOST_IMAGE_NAME }}:main-${{ matrix.arch }}
            ${{ env.GITHUB_REGISTRY }}/${{ env.HOST_IMAGE_NAME }}:main-${{ env.SHORT_SHA }}-${{ matrix.arch }}
          labels: |
            coolify.managed=true
            org.opencontainers.image.description=Portable Sentinel host binary

      - name: Build and Push Flux Image (${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: flux
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.GITHUB_REGISTRY }}/${{ env.FLUX_IMAGE_NAME }}:main-${{ matrix.arch }}
            ${{ env.GITHUB_REGISTRY }}/${{ env.FLUX_IMAGE_NAME }}:main-${{ env.SHORT_SHA }}-${{ matrix.arch }}
          labels: |
            coolify.managed=true
            org.opencontainers.image.description=Coolify Flux connection broker

      - name: Build and Push Builder Image (${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.builder
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.GITHUB_REGISTRY }}/${{ env.BUILDER_IMAGE_NAME }}:main-${{ matrix.arch }}
            ${{ env.GITHUB_REGISTRY }}/${{ env.BUILDER_IMAGE_NAME }}:main-${{ env.SHORT_SHA }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.description=Coolify image build container

  merge-manifest:
    runs-on: ubuntu-24.04
    needs: build-push
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set short commit SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Login to ${{ env.GITHUB_REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & publish manifest on ${{ env.GITHUB_REGISTRY }}
        run: |
          docker buildx imagetools create \
          ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:main-${{ env.SHORT_SHA }}-amd64 \
          ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:main-${{ env.SHORT_SHA }}-aarch64 \
          --tag ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:main \
          --tag ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:main-${{ env.SHORT_SHA }}

      - name: Create & publish host artifact manifest
        run: |
          docker buildx imagetools create \
          ${{ env.GITHUB_REGISTRY }}/${{ env.HOST_IMAGE_NAME }}:main-${{ env.SHORT_SHA }}-amd64 \
          ${{ env.GITHUB_REGISTRY }}/${{ env.HOST_IMAGE_NAME }}:main-${{ env.SHORT_SHA }}-aarch64 \
          --tag ${{ env.GITHUB_REGISTRY }}/${{ env.HOST_IMAGE_NAME }}:main \
          --tag ${{ env.GITHUB_REGISTRY }}/${{ env.HOST_IMAGE_NAME }}:main-${{ env.SHORT_SHA }}

      - name: Create & publish Flux manifest
        run: |
          docker buildx imagetools create \
          ${{ env.GITHUB_REGISTRY }}/${{ env.FLUX_IMAGE_NAME }}:main-${{ env.SHORT_SHA }}-amd64 \
          ${{ env.GITHUB_REGISTRY }}/${{ env.FLUX_IMAGE_NAME }}:main-${{ env.SHORT_SHA }}-aarch64 \
          --tag ${{ env.GITHUB_REGISTRY }}/${{ env.FLUX_IMAGE_NAME }}:main \
          --tag ${{ env.GITHUB_REGISTRY }}/${{ env.FLUX_IMAGE_NAME }}:main-${{ env.SHORT_SHA }}

      - name: Create & publish builder manifest
        run: |
          docker buildx imagetools create \
          ${{ env.GITHUB_REGISTRY }}/${{ env.BUILDER_IMAGE_NAME }}:main-${{ env.SHORT_SHA }}-amd64 \
          ${{ env.GITHUB_REGISTRY }}/${{ env.BUILDER_IMAGE_NAME }}:main-${{ env.SHORT_SHA }}-aarch64 \
          --tag ${{ env.GITHUB_REGISTRY }}/${{ env.BUILDER_IMAGE_NAME }}:main \
          --tag ${{ env.GITHUB_REGISTRY }}/${{ env.BUILDER_IMAGE_NAME }}:main-${{ env.SHORT_SHA }}
