name: CI

on:
  pull_request:
  push:
    branches: [main, next]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # dtolnay/rust-toolchain's docs are explicit: when passing an explicit
      # `toolchain` input, the action ref must be @master, not @stable --
      # @stable pulls in whatever is CURRENTLY stable at CI run time
      # (drifting over time) rather than respecting the pinned toolchain
      # input, defeating the whole point of pinning 1.97.1 here.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --release --locked

      # The default-feature steps above do build the `traffic` *crate* (it is a
      # workspace member), but `crates/api/src/routes/traffic.rs` and the whole
      # traffic-wiring block in `src/main.rs` sit behind the `api`/binary
      # `traffic` feature and never compile without these steps — while the
      # published Docker image is built with the feature on. Without them a
      # refactor can break what actually ships while CI stays green.
      - name: Clippy (traffic feature)
        run: cargo clippy --workspace --all-targets --features traffic -- -D warnings

      - name: Test (traffic feature)
        run: cargo test --workspace --features traffic

      - name: Build (traffic feature)
        run: cargo build --release --locked --features traffic

      # Prebuilt-binary install (not `cargo install`) so this doesn't compile
      # cargo-audit from source on every run. Checks Cargo.lock against the
      # RustSec Advisory Database; fails the job on any known vulnerability.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit
        run: cargo audit

  # Verifies the image still builds, on PRs only. On a push to main/next the
  # matching release workflow (release-main.yaml / release-next.yaml) rebuilds
  # the same Dockerfile and pushes it, so repeating a build-only pass here would
  # be pure duplicate work — those runs already fail the pipeline if it breaks.
  docker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: sentinel:ci
