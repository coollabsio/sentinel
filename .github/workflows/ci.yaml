name: CI

on:
  pull_request:
  push:
    branches: [main, next]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # dtolnay/rust-toolchain's docs are explicit: when passing an explicit
      # `toolchain` input, the action ref must be @master, not @stable --
      # @stable pulls in whatever is CURRENTLY stable at CI run time
      # (drifting over time) rather than respecting the pinned toolchain
      # input, defeating the whole point of pinning 1.96.0 here.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --release --locked

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: sentinel:ci
